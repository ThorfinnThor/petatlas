name: Format Purchase Guides

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-and-cleanup:
    if: github.head_ref == 'affiliate-kaufhilfen-2026-09-19'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: affiliate-kaufhilfen-2026-09-19
          persist-credentials: true
      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Formatieren und Hilfsworkflow entfernen
        run: |
          npx prettier --write src/features/commerce/purchase-guides.ts
          git rm .github/workflows/format-purchase-guides.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/commerce/purchase-guides.ts
          git commit -m "Format expanded purchase guides"
          git push origin HEAD:affiliate-kaufhilfen-2026-09-19
