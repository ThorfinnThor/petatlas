# M07-02 — Supply-Chain-Prüfungen.
#
# Der Workflow läuft ohne Secrets und ohne Schreibrechte. Er prüft, was ein
# Angriff über Abhängigkeiten oder über einen fremden Pull Request anrichten
# könnte, und läuft zusätzlich zeitgesteuert, damit neue Schwachstellen auch
# ohne Commit auffallen.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Wöchentlich, damit neue Meldungen ohne Commit auffallen.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abhaengigkeiten:
    name: Abhängigkeiten und Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation ohne Netzänderung am Lockfile
        run: npm ci

      # Das Lockfile ist verbindlich. Verändert die Installation es, stimmt
      # etwas nicht mit den deklarierten Versionen.
      - name: Lockfile bleibt unverändert
        run: git diff --exit-code -- package-lock.json

      - name: Alle Abhängigkeiten sind exakt gepinnt
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const alle = { ...pkg.dependencies, ...pkg.devDependencies };
            const unscharf = Object.entries(alle).filter(([, v]) => !/^\d+\.\d+\.\d+$/.test(v));
            if (unscharf.length > 0) {
              console.error("Nicht exakt gepinnt:", unscharf);
              process.exit(1);
            }
            console.log(Object.keys(alle).length + " Abhängigkeiten, alle exakt gepinnt.");
          '

      - name: Bekannte Schwachstellen
        run: npm audit --audit-level=high

  workflows:
    name: Workflow-Härtung
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Die vier Härtungsregeln stehen in einem Skript, damit sie auch in der
      # lokalen Prüfkette laufen. Sie nur hier zu haben hat vier Commits lang
      # einen roten Prüfstand erzeugt, der lokal unsichtbar war.
      # Das Skript kommt ohne Abhängigkeiten aus; dieser Job braucht deshalb
      # weiterhin nur den Checkout.
      - name: Workflow-Härtung
        run: bash scripts/checks/workflows.sh

  geheimnisse:
    name: Secret- und Fixture-Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Repository mit voller Historie auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Audit über versionierte Dateien
        run: npm run check:security -- --repo-only

      - name: Rechteprüfung der Quellen
        run: npm run check:licenses
