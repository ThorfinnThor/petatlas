# M07-01 — Prüfkette für Pull Requests und main.
#
# Der Workflow braucht keinen Partneraccount und kein einziges Secret. Ein
# Fork kann ihn deshalb vollständig ausführen, ohne Zugriff auf etwas zu
# bekommen, das ihm nicht gehört.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Standard ist Lesen. Einzelne Jobs erhöhen nur, was sie wirklich brauchen.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefkette:
    name: Lint, Typecheck, Tests, Fixture-Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions sind auf volle Commit-SHAs gepinnt: ein verschobener Tag
      # ändert damit nicht, welcher Code läuft.
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci statt install: das Lockfile ist verbindlich, keine stillen Updates.
      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Formatierung
        run: npm run format:check

      - name: Unit- und Vertragstests
        run: npm run test:unit

      - name: Statuswerkzeug
        run: |
          python3 scripts/test_project_status.py
          npm run status:validate

      - name: Aufgabenstand und Handoff stimmen überein
        run: npm run check:handoff

      - name: GOT-Snapshot ist aktuell zur Quelldatei
        run: |
          npm run snapshot:got
          git diff --exit-code -- data-snapshots/

      - name: Fixture-Build
        run: npm run build:fixture

      - name: Gebührendaten
        run: npm run build:fees

      - name: Suchindex
        run: npm run build:search

      - name: Gesundheitsstand
        run: npm run build:health

      - name: Sitemap und robots.txt
        run: npm run build:sitemap

      # Prüft den gebauten Output, nicht die Absicht (M18-01).
      - name: SEO-Gates
        run: npm run check:seo

      # Zweiter Durchgang mit allen Funktionen und so, als wäre der Build
      # indexierbar. Ohne ihn prüfte der Gate heute fast nichts: solange die
      # Launch-Gates offen sind, trägt jede Seite noindex.
      - name: SEO-Probelauf mit allen Funktionen
        env:
          ENABLE_FEATURES: 'costs,map,travel,commerce,care,toys,food,profile'
        run: |
          npm run build:fixture
          npm run build:fees
          npm run build:places
          npm run build:health
          npm run build:search
          npm run build:sitemap
          npm run build:headers
          npm run check:seo -- --als-indexierbar

      - name: Rechteprüfung der Quellen
        run: npm run check:licenses

      # Nach dem Build, weil erst dann etwas zu messen ist. Der Lauf wird rot,
      # sobald ein Budget seine Stoppgrenze erreicht (M17-06).
      - name: Budgets
        run: npm run check:budgets

      # Ein Rollback muss gegen die heutigen Rechte zulässig sein, nicht gegen
      # die von damals. Geprüft wird der Stand, der gerade gebaut wurde.
      - name: Rollback-Zulässigkeit des aktuellen Standes
        run: npm run rollback:pruefen -- HEAD

      # Der Audit läuft nach dem Build und sieht damit auch dist/.
      - name: Secret- und Fixture-Audit über Repo und dist
        run: npm run check:security

      # Was hier nicht auffällt, fällt draußen auf (M18-02).
      - name: Output-Audit über dist
        run: npm run check:dist

      # Ein toter interner Verweis führt auf eine 404-Seite, und der Leser
      # hält das für das Ende des Angebots. Fremde Adressen werden hier nicht
      # abgerufen — dafür gibt es source-check.yml.
      - name: Interne Verweise im Output
        run: npm run check:links

      # Die Prüfung erteilt nichts; sie widerspricht einer Behauptung ohne
      # Person, ohne Datum oder ohne Nachweis (M18-06).
      - name: Freigabestand ist widerspruchsfrei
        run: npm run check:release

      - name: Produktionsfreigaben und Konfiguration
        run: npx vitest run tests/launch-readiness.test.ts tests/build-mode.test.ts

  browser:
    name: Browser-Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Browser installieren
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-End gegen den gebauten Output
        run: npm run test:e2e

      # Eigener Lauf: der reguläre Build prüft, dass eine abgeschaltete
      # Funktion keine Seite hat. Der Rechner braucht sein Flag.
      # Zugänglichkeit ist eine Abnahmebedingung, kein Extralauf (M18-04).
      - name: Zugänglichkeit und Browsermatrix
        if: ${{ !cancelled() }}
        run: npm run test:accessibility

      - name: End-to-End für Funktionen hinter ihrem Feature Flag
        if: ${{ !cancelled() }}
        run: npm run test:e2e:features

      - name: Browserberichte sichern
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-reports
          path: reports/
          retention-days: 7
